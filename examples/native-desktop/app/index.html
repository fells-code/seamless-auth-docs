<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'"
    />
    <title>Desk Notes</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <h1>Desk Notes</h1>
    <p id="who" aria-live="polite">Loading</p>
    <div class="actions">
      <button data-action="signIn">Sign in with your browser</button>
      <button data-action="listNotes">List notes</button>
      <button data-action="exportNotes">Export notes (recent passkey)</button>
      <button data-action="sendNotice">Email me a notice</button>
      <button data-action="refresh">Refresh tokens</button>
      <button data-action="signOut">Sign out</button>
      <button data-action="signOutEverywhere">Sign out of Seamless too</button>
    </div>
    <h2>Last result</h2>
    <pre id="result" tabindex="0"></pre>
    <h2>Access token claims</h2>
    <pre id="claims" tabindex="0"></pre>
    <script src="./renderer.js" type="module"></script>
  </body>
</html>
